risks:
  - id: "R-001"
    status: "open"
    risk: "Positive molecule-optimization target is not yet evidence-qualified."
    control: "Block molecule optimization unless the target is ADVANCE; allow TYK2 only in REJECTION_DEMO or METHOD_ONLY mode."
  - id: "R-002"
    status: "open"
    risk: "ChEMBL TYK2 activity count from 2026-07-06 was not reverified during the 2026-07-16 API outage."
    control: "Treat the number as pending verification and prohibit it from final claims until a response snapshot is stored."
  - id: "R-003"
    status: "open"
    risk: "ADMET-AI and RAscore installation/runtime have not been smoke-tested in this repository."
    control: "Keep them as planned dependencies and require a version-pinned smoke test before implementation claims. RDKit now satisfies this bar (pinned in requirements-chem.txt, smoke-tested by tests/test_chem.py) and occupies the same (molecule)->ToolResult seam; ADMET-AI and RAscore remain unverified and unclaimed."
  - id: "R-004"
    status: "open"
    risk: "Drug-design outputs and synthesis information can create scientific, safety, and dual-use risk."
    control: "Use deterministic chemistry gates, suppress actionable synthesis instructions, require human approval, and retain audit events."
  - id: "R-005"
    status: "open"
    risk: "Hades Console persists management state as a single-process JSON file, not a production multi-user database."
    control: "Keep state under the ignored artifacts directory by default, use atomic writes and a process-local lock, and require a real database plus auth before multi-user deployment."
  - id: "R-006"
    status: "open"
    risk: "A local LLM in the console could assert facts the decision core never computed."
    control: "Give the model only the computed fact set, check every output for invented numbers, evidence IDs, citations, flipped decisions, and therapeutic claims, fall back to the deterministic template on any violation, and keep the runtime OFF by default."

decisions:
  - id: "D-001"
    date: "2026-07-19"
    decision: "Use the 2026-07-16 cold assessment and commit 25c622e as the current correction source."
    rationale: "It corrects the indication-specific clinical premise and tool feasibility."
  - id: "D-002"
    date: "2026-07-19"
    decision: "Position TYK2/deucravacitinib as an IBD self-falsification and rejection demo, not a positive validation case."
    rationale: "Deucravacitinib is psoriasis-approved but failed the cited phase-2 IBD programs."
  - id: "D-003"
    date: "2026-07-19"
    decision: "Differentiate on indication-aware contradiction detection, failure ledgers, provenance, and lightweight reproducibility."
    rationale: "The generic target-to-lead closed loop already has close prior art."
  - id: "D-004"
    date: "2026-07-19"
    decision: "Use ADMET-AI for planned pretrained inference and a two-stage SA/RAscore then top-5 AiZynthFinder synthesis gate."
    rationale: "TDC is a benchmark/data source, while full-loop retrosynthesis is too slow for the MVP."
  - id: "D-005"
    date: "2026-07-19"
    decision: "Keep the Score Improvement Agent in the evaluation plane, outside scientific run-time authority."
    rationale: "Competition-score optimization must not alter scientific decisions or evidence."
  - id: "D-006"
    date: "2026-07-19"
    decision: "Implement the JB-derived decision core (src/h2l) as a deterministic offline harness per the 2026-07-19 design spec, before any UI or live API."
    rationale: "Approach C ports JB's proven operating invariants (versioned registry, approval gate, snapshot-first fallback, read-only eval) with a small, testable footprint. TYK2/IBD returns REJECT/molecule_eligible=false; the offline ablation eval is byte-reproducible under seed 42."
  - id: "D-007"
    date: "2026-07-19"
    decision: "Adapt Paperclip management patterns only for software operations in Hades Console and keep them isolated from scientific authority."
    rationale: "Projects, tasks, agents, runs, costs, approvals, and activity events improve operational auditability, but console mutations must not change evidence snapshots, target decisions, molecule eligibility, or evaluation outputs."
  - id: "D-008"
    date: "2026-07-20"
    decision: "Implement field-2 molecular optimization as an offline, METHOD_ONLY tool-adapter loop with a proxy-only vs multi-objective ablation, instead of fine-tuning the LLM."
    rationale: "Inference accuracy in drug discovery comes from versioned property/synthesis tools and evidence, not LLM weights. Deterministic reference adapters expose a (molecule)->ToolResult seam for ADMET-AI/QSAR/SA-RAscore, keep measured/model/proxy separate, and the seeded ablation shows the multi-objective candidate beats the similarity-only baseline (selection accuracy 1.00 vs 0.43) byte-reproducibly."

  - id: "D-009"
    date: "2026-07-25"
    decision: "Admit a local Ollama model into the console as an explanation layer only, gated by an output guardrail and a deterministic template fallback, and keep it OFF by default."
    rationale: "Reasoning quality in this domain comes from evidence and versioned tools, not model weights, so the model is given no authority over facts. It receives only the already-computed fact set, and any output that invents a number, evidence ID, or citation, flips the decision, leaks reasoning, or asserts therapeutic benefit is discarded in favour of the template. With H2L_LLM_ENABLED unset the harness performs no network I/O and the evals stay byte-reproducible."

  - id: "D-010"
    date: "2026-07-25"
    decision: "Add an optional RDKit chemistry backend behind H2L_CHEM_BACKEND and keep the dependency-free reference adapters as the default."
    rationale: "The reference adapters read authored descriptors and a 16-bit hand-written fingerprint, so no result depended on real chemistry. The RDKit backend computes descriptors, QED, ECFP4 Tanimoto, SA score, and PAINS/Brenk alerts from SMILES at the same (molecule)->ToolResult seam. On a structure-backed pool the similarity-only baseline puts three reactive liabilities (Michael acceptor, acylhydrazine, alkyl halide) in its top-5 while the multi-objective gate rejects all of them: selection accuracy 0.571 -> 1.000, top-k precision 0.40 -> 1.00, paired bootstrap delta 0.429 with 95% CI [0.214, 0.714]. Keeping the reference backend as the default preserves the offline, dependency-free core and the byte-reproducible published ablation."

  - id: "D-011"
    date: "2026-07-25"
    decision: "Serve the web console's RunSnapshot from the decision core through read-only GET /api/workspace/runs, and keep the authored fixtures as a labelled offline fallback rather than deleting them."
    rationale: "The console rendered hand-authored TypeScript, so deleting the entire Python core would not have changed a pixel and no screen was evidence of the harness. The projection now derives run, stages, evidence, targets, failures, events, and artifacts from a real DrugDiscoveryHarness result and its approved packet: the TYK2 score reversal (100 -> 0) is three deductions that each name a rule and an evidence id, a pending snapshot still does not reach the screen, and both hypotheses show molecule stages blocked - REJECT by the gate and ADVANCE by human approval. Fields the packet does not carry (association score, tractability) are emitted as null/Unknown and rendered as absent instead of being filled with a placeholder number. The fixtures stay because the console must open without the harness and the molecule comparison screen has no computed equivalent yet; classification badges keep the two apart, and the connection chip goes green only when the harness actually answered."

  - id: "D-012"
    date: "2026-07-25"
    decision: "Give the local model bounded action selection over a fixed allow-list, enforce the molecule gate at execution rather than at selection, and turn the model on by default on the serving plane only."
    rationale: "The project rule says the LLM selects actions and writes bounded explanations, but only the explanation half existed: llm.py had one call site and nothing chose anything, so the system was a report generator. src/h2l/agent.py now lets the model pick which of seven allow-listed actions runs next; the harness executes it and writes every observation, so a proposal that carries its own result contributes only the action name. Validation refuses an unknown action, a hypothesis id the registry does not hold, and an action whose exact observation is already in the transcript - the repeat check is what stops a 7-8B model from burning the whole budget re-running one tool. Every failure (dead runtime, unparseable JSON, invented id) falls through to a deterministic policy and is recorded per step as selected_by plus the reason, so a reviewer can see how much of the run the model drove; with the model off the whole run is the policy and is byte-reproducible. The gate is deliberately not checked at selection: the agent may propose optimize_molecules on the REJECTED TYK2 target, and the harness refuses and records it. Measured on gemma4:latest the model drives 6 of 6 steps and reaches that refusal on its own. The serving default flipped to on because an absent Ollama costs one refused connection before the template answers, while the evaluation plane never enters this module and LLMConfig.offline() pins it off wherever output must stay reproducible."

  - id: "D-013"
    date: "2026-07-25"
    decision: "Publish every count the harness can compute in the explanation fact set, and let a refused draft buy exactly one retry carrying the violation codes."
    rationale: "With the model on by default the console still showed templates: across three installed models and three fixture decisions the guardrail refused all but two drafts, so 'the model writes the sentence' was false in practice. The cause was a fact set that published three counts, which forced a model wanting any other number to derive it and then be rejected as unsupported. Counts derived from the records are facts, so in_indication, cross_indication, by_outcome, and by_kind now ship with the rest. The retry sends only the violation codes, never the rejected draft, because feeding a draft back lets a fabrication survive by being edited. Two other findings came out of measuring rather than assuming: quoting the run's own computed decision was being read as a therapeutic claim (fixed by stripping the decision token the way rule ids already were, so ADVANCE written over a REJECT still trips), and appending the correction after the prompt's trailing cue made models transcribe the instruction into the explanation - which then satisfied the verbatim-indication check with the recitation. Corrections now live in the rule list, and a process_leak check refuses a transcript outright. Result on the fixture decisions: 9 of 9 drafts accepted, and gemma4:latest clears the guard on the first attempt every time, which is why it replaced qwen2.5:7b-instruct as the default."

open_questions:
  - id: "Q-001"
    question: "Which alternative target will be the positive molecule-optimization branch after the same indication-aware evidence gate?"
    owner: "Domain lead"
  - id: "Q-002"
    status: "answered"
    question: "Which LLM/runtime and credit budget will be available in the final environment?"
    answer: "Local Ollama (gemma4:latest by default, on unless H2L_LLM_ENABLED=0), so there is no per-token cost and no network dependency. Any installed model can be selected per request through GET /api/models; a hosted model can replace the runtime through the same generator seam."
    owner: "Engineering lead"
  - id: "Q-003"
    question: "What exact licenses, API terms, snapshot retention, and redistribution rules apply to each external source?"
    owner: "Project lead"
  - id: "Q-004"
    question: "What measured manual baseline will support time/cost savings claims?"
    owner: "Product lead"
